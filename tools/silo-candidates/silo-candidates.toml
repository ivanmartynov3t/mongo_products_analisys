# silo-candidates configuration (issue #36). Paths are relative to the repository root.

# The silo is read from git objects at this ref — never checked out, never written.
silo_path = "../prod_info_silo"
silo_ref = "origin/main"
silo_data_dir = "data"
silo_catalog = "data/catalog_index.json"

products_dir = "products"
# Dictionary ID -> silo tag mapping, generated by tools/taxonomy-reconcile.
reconciliation_tsv = "reports/taxonomy-reconciliation.tsv"

# A tag counts for a document at this probability or above; a candidate needs this many documents.
min_probability = 0.75
min_docs = 2
# Public pages listed per candidate.
top_docs = 3
# Pages on these hosts (and their subdomains) are never named: code hosts may hold private
# repositories, and internal systems are not public. They are counted as source files.
non_public_hosts = ["github.com", "githubusercontent.com", "github.io", "gitlab.com", "bitbucket.org", "atlassian.net"]

# The only file this tool is allowed to write.
output = "reports/silo-candidates.md"
