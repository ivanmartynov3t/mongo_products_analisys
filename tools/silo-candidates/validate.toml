# Porting validator configuration (issue #53, Plan 09 L4). Paths are relative to the repository root.

dictionary = "feature-dictionary.md"
triage_ledger = "tools/silo-candidates/triage.tsv"
candidates_config = "tools/silo-candidates/silo-candidates.toml"
candidates_output = "reports/silo-candidates.md"

# A quoted passage is checked when it has at least this many words (shorter quotes are names and labels).
min_quote_words = 4

# Generated by a tool: never edited by hand. reports/silo-candidates.md is accepted when it is
# byte-identical to a fresh run; any other tool-owned file in the diff needs a human to confirm
# that it is unchanged tool output.
tool_owned = ["reports/review-queue.md", "reports/silo-candidates.md", "reports/evidence-gaps.md",
              "reports/silo-snapshot.md", "reports/silo-snapshot.json",
              "reports/taxonomy-reconciliation.md", "reports/taxonomy-reconciliation.tsv"]

# The base-tree files read to learn which names and repositories this repository already names.
# Every changed file is scanned, whatever its suffix.
text_suffixes = [".md", ".tsv", ".toml", ".json", ".py", ".sh", ".yml", ".yaml", ".txt", ""]

# Status labels, by class. A status cell may hold several ("Confirmed (…); Unverified (…)"): every
# class found applies. Matching ignores case; a phrase is removed once matched, so "not supported"
# never also counts as "supported". Classes are matched in this order.
[status]
absent = ["confirmed absent", "not supported", "not implemented", "not available", "not present", "absent", "❌"]
unverified = ["unverified", "unknown", "❓"]
partial = ["partially supported", "partially", "partial", "limited", "🧪"]
roadmap = ["roadmap", "planned", "🗺️"]
confirmed = ["confirmed", "supported", "✅"]

# Files a run may change, per checklist item. `{item}` is the product folder name.
# update-plans/09-product-loop.md is allowed for every item (the loop ticks it).
[scope]
product = ["products/*/{item}/**", "tools/silo-candidates/triage.tsv", "tools/taxonomy-reconcile/decisions.tsv",
           "feature-dictionary.md", "reports/silo-candidates.md", "reports/taxonomy-reconciliation.md",
           "reports/taxonomy-reconciliation.tsv"]
scope-triggers = ["docs/coverage-scope.md", "docs/coverage-triggers.toml"]
cross-product = ["reports/**"]
readme = ["README.md"]
always = ["update-plans/09-product-loop.md"]
