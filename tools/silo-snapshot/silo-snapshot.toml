# silo-snapshot configuration (issue #34). Paths are relative to the repository root.

# The silo is read from git objects at this ref — never checked out, never written.
# The snapshot records the exact commit SHA it was generated from.
silo_path = "../prod_info_silo"
silo_ref = "origin/main"
silo_data_dir = "data"
silo_config = "config/products.yaml"
silo_catalog = "data/catalog_index.json"

# Analysis product folders are matched to silo products by folder name == silo slug.
products_dir = "products"

# The only files this tool is allowed to write.
output_md = "reports/silo-snapshot.md"
output_json = "reports/silo-snapshot.json"
