# Machine-readable revisit triggers for docs/coverage-scope.md (issue #35).
# Checked by tools/scope-triggers against reports/silo-snapshot.json.
#
# Per product (silo slug):
#   decision              the decision recorded in coverage-scope.md (for the report only)
#   recorded_status       silo status when the decision was taken; any other status fires
#   status_in             fires when the silo status is one of these
#   min_catalog_entries   fires when the silo's catalog holds at least this many entries
#   manual                a trigger no script can check; listed for the human, never fires
#
# A 3T product in the snapshot with no analysis folder and no entry here also fires
# ("untracked"), and so does an entry here that is missing from the snapshot.

[products.policy-engine]
decision = "In scope — inside Govern"
recorded_status = "Shipped"
manual = "It ships as a standalone product"

[products.pii-scanner]
decision = "In scope — inside Govern and 3T MCP"
recorded_status = "Shipped"
manual = "It ships as a standalone product"

[products.studio-3t-ee]
decision = "Revisit later — then inside Studio 3T"
recorded_status = "Alpha"
status_in = ["GA", "Live", "Shipped", "Released"]

[products.interceptor-proxy]
decision = "Revisit later"
recorded_status = "Working PoC"
status_in = ["Shipped", "Live", "GA"]

[products.studio-3t-ai-chat]
