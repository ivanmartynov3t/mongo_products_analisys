# Machine-readable revisit triggers for docs/coverage-scope.md (issue #35).
# Checked by tools/scope-triggers against reports/silo-snapshot.json.
#
# Per product (silo slug):
#   decision              the decision in coverage-scope.md, as amended 2026-09-25 (for the report only)
#   recorded_status       the table's *Silo status*; another status that is not a trigger is only noted
#   status_in             the *Revisit trigger*: fires when the silo status is one of these
#   min_catalog_entries   the *Revisit trigger*: fires when the silo's catalog holds at least this many entries
#   manual                a *Revisit trigger* no script can check; listed for the human, never fires
#
# Also fires: a 3T product in the snapshot with no analysis folder and no entry here ("untracked"),
# an entry here that is missing from the snapshot, and an entry for a product that is now analysed.
# Out-of-scope rows fire only when the entry itself goes stale (as above); a status change is only noted.

[products.policy-engine]
decision = "In scope — inside Govern"
recorded_status = "Shipped"
manual = "It ships as a standalone product"

