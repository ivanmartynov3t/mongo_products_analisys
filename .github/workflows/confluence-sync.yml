name: Confluence Sync

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "tools/confluence-sync/**"
  schedule:
    # Run once daily at 04:00 UTC (after Monday 02:00 UTC silo scrape and daily maintenance)
    - cron: "0 4 * * *"
  workflow_dispatch:

# Avoid concurrent runs against the same Confluence space to prevent page title collisions
concurrency:
  group: confluence-sync
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Documentation to Confluence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bed5674f8f377be825a5ace64751b217a3 # v5.3.0
        with:
          enable-cache: true

      - name: Publish changes
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          set -o pipefail
          report_path="tools/confluence-sync/last-run-report.md"
          log_path="$(mktemp)"
          status=0

          ./tools/confluence-sync/sync.sh apply --delete 2>&1 | tee "$log_path" || status=$?

          if [[ "$status" -ne 0 && ! -f "$report_path" ]]; then
            {
              echo "# Confluence sync failed before writing the normal report"
              echo
              echo "- Exit status: $status"
              echo
              echo "## Command output"
              echo
              echo '```text'
              cat "$log_path"
              echo '```'
            } > "$report_path"
          fi

          exit "$status"

      - name: Upload Last Run Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: confluence-sync-last-run-report
          path: tools/confluence-sync/last-run-report.md
          if-no-files-found: error
